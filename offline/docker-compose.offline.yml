# 华为路由器 IPv6 防火墙白名单同步 —— 离线部署用 compose
#
# 与仓库根的 docker-compose.yml 只有一处差别：**没有 build 段**。
# 镜像来自离线 tar（docker load 导入），所以目标机不需要源码、不需要外网。
#
# 部署（全程不用 .env）：
#   1) 导入镜像
#        docker load -i ipv6sync-1.0.7-amd64-image.tar     # x86_64 NAS / PC（唯一产物）
#   2) 改下面 environment 里的 ADMIN_USERNAME / ADMIN_PASSWORD（控制台登录账号）
#   3) mkdir -p data && sudo chown 10001:10001 data        # 见下方「挂载目录属主」
#   4) docker compose -f docker-compose.offline.yml up -d
#   5) 浏览器打开 http://<NAS 的 IP>:6600/ ，用上面两个变量登录
#   6) 在网页「路由器连接」里填 路由器地址 / 管理员密码，保存即开始同步
#      —— 路由器账号、NAS 的 MAC、检测周期等**全部在网页里设置**，
#         存进 /data/settings.json（0600），改完热生效，不用重建容器。
#
# 浏览器控制台：
#   可以看同步状态、改路由器地址与密码、改检测周期、读白名单与设备列表。
#   ⚠ 这是局域网内的管理后台：**不要**把它映射到公网，密码也别用弱口令。
#   不设 ADMIN_PASSWORD 时控制台不启动（安全默认），日志里会提示。
#
# 查 NAS 的 MAC（用于在网页里填「目标设备 MAC」）：
#   docker compose -f docker-compose.offline.yml run --rm ipv6sync --list-hosts
#   （或在控制台点「读取设备列表」）
#
# 看一眼当前白名单：
#   docker compose -f docker-compose.offline.yml run --rm ipv6sync --whitelist

services:
  ipv6sync:
    # 必须与 tar 里的 RepoTags 一致（离线 tar 打的就是这个标签）
    image: ipv6sync:latest
    container_name: ipv6sync
    restart: unless-stopped

    # 唯一需要在 yaml 里设置的东西：浏览器控制台的登录账号
    environment:
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=change-me-please

    # 其余设置一律在网页里改，env_file 留给进阶用法（docker secret 等）：
    # env_file: .env

    # host 网络 —— 硬要求，不是可选项：本程序只读「本机网卡」的 IPv6，
    # 只有 host 网络下「本机」才是 NAS 自己。换成 bridge 会读到容器自己的
    # 网卡（里面没有全局地址），整台机器就永远同步不了。
    network_mode: host

    volumes:
      # 放会话缓存（Cookie + CSRF 令牌，不含密码）与网页保存的设置
      # （settings.json —— 里面**会有**明文路由器密码，在网页里填过就有）。
      # ★ 宿主机上的这个目录必须让容器内的 uid 10001 可写：
      #     mkdir -p data && sudo chown 10001:10001 data
      #   否则启动后登录会失败（写不进 /data/session.json），日志里是 Permission denied。
      - ./data:/data

      # 不想管宿主机属主就用命名卷 —— Docker 会在创建卷时按镜像里的属主
      # (10001:10001) 初始化，天然可写。用它就把上面那行注释掉，并启用文末的 volumes 段。
      # - ipv6sync-data:/data

    # network_mode: host 时端口直接开在宿主机上（6600 控制台 / 8099 健康检查），
    # 无需 ports 映射；若改用 bridge，请把下面两行取消注释。
    # ports:
    #   - "6600:6600"        # 浏览器控制台
    #   - "127.0.0.1:8099:8099"   # 健康检查只在宿主机本地

    # 不想把控制台密码写进 yaml，可以用 docker secret（宿主机上先建好文件）：
    #   在 environment 里改用  - ADMIN_PASSWORD_FILE=/run/secrets/web_password
    # secrets:
    #   - web_password
    # 然后启用文末的 secrets 段。

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# 用命名卷时启用这一段
# volumes:
#   ipv6sync-data:

# 用 docker secret 时启用这一段（文件先放到宿主机上，权限 600）
# secrets:
#   web_password:
#     file: ./secrets/web_password.txt
